<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found — Safar Hashim</title>
    <meta name="description" content="That page does not exist. Return to Safar Hashim's portfolio." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#e6e4de" />
    <meta name="color-scheme" content="light dark" />

    <!-- Same rule as the site: paper by default, a stored choice turns it over. -->
    <script>
      try {
        var theme = localStorage.getItem('safar-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16171a')
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&display=swap"
    />

    <!--
      Deliberately self-contained. The app's stylesheets are hashed at build
      time, so this page cannot link to them; the handful of values it needs
      are copied from src/styles/tokens.css and nothing else is invented.
    -->
    <style>
      :root {
        color-scheme: light;
        --paper: #e6e4de;
        --ink: #16171a;
        --ink-soft: #5d5e58;
        --rule: #c5c3b8;
        --reg: #2136e8;
        --gutter: clamp(1.125rem, 3.4vw, 3rem);
        --ease: cubic-bezier(0.22, 0.61, 0.2, 1);
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
        --paper: #16171a;
        --ink: #e6e4de;
        --ink-soft: #94958d;
        --rule: #31323a;
        --reg: #7f8dff;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      a { color: inherit; text-decoration: none; }
      .hidden-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

      body {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 2rem;
        padding: 1.5rem var(--gutter);
        background: var(--paper);
        color: var(--ink);
        font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .readout {
        font-family: 'DM Mono', ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 0.6875rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .rail {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--rule);
      }

      .mark { font-size: 0.8125rem; font-weight: 600; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); }
      .mark span { font-weight: 400; letter-spacing: 0.04em; }

      main { align-self: center; }

      h1 {
        font-size: clamp(2.6rem, 9vw, 7rem);
        font-weight: 600;
        line-height: 0.84;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }

      .note { max-width: 34ch; padding-top: 1.5rem; color: var(--ink-soft); }

      .home {
        display: inline-flex;
        align-items: center;
        gap: 2rem;
        min-height: 2.75rem;
        margin-top: 2.5rem;
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--ink);
      }

      .home span:last-child { font-size: 1.25rem; transition: transform 420ms var(--ease); }
      .home:hover span:last-child { transform: translateX(3px); }

      .foot {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--rule);
      }

      .status::before {
        content: '';
        display: inline-block;
        width: 0.3125rem;
        height: 0.3125rem;
        margin-right: 0.5rem;
        background: var(--reg);
        vertical-align: 0.05em;
      }

      @media (prefers-reduced-motion: reduce) {
        .home span:last-child { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="rail">
      <a class="mark" href="/">ssaff<span aria-hidden="true">.666</span><span class="hidden-label">.666 — back to the portfolio</span></a>
      <p class="readout status">404</p>
    </header>

    <main>
      <h1>Nothing<br />here.</h1>
      <p class="note">That address does not point at anything. The work is all on one page.</p>
      <a class="home readout" href="/">
        <span>Back to the portfolio</span>
        <span aria-hidden="true">&rarr;</span>
      </a>
    </main>

    <footer class="foot">
      <span class="readout">Safar Hashim &copy; 2026</span>
      <span class="readout">Kochi, India</span>
    </footer>
  </body>
</html>
